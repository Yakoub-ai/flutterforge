name: Plugin Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── JSON validation ──────────────────────────────────────────────────────

      - name: Validate plugin.json
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null

      - name: Validate .mcp.json
        run: python3 -m json.tool .mcp.json > /dev/null

      - name: Validate hooks.json
        run: python3 -m json.tool hooks/hooks.json > /dev/null

      # ── Shell script syntax ──────────────────────────────────────────────────

      - name: Check shell script syntax
        run: |
          failed=0
          for f in hooks/lib/*.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "FAIL: $f has syntax errors"
              failed=1
            else
              echo "OK: $f"
            fi
          done
          exit "$failed"

      # ── SKILL.md frontmatter ─────────────────────────────────────────────────

      - name: Check SKILL.md frontmatter
        run: |
          failed=0
          for f in skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            result=$(python3 - "$f" <<'PYEOF'
import sys, re

path = sys.argv[1]
try:
    content = open(path, encoding="utf-8").read()
except OSError as e:
    print(f"FAIL: {path} could not be read: {e}")
    sys.exit(1)

if not content.startswith("---\n"):
    print(f"FAIL: {path} missing YAML frontmatter opening ---")
    sys.exit(1)

# Extract content between first pair of ---
parts = content.split("---")
if len(parts) < 3:
    print(f"FAIL: {path} frontmatter not closed with ---")
    sys.exit(1)

front = parts[1]
for field in ("name:", "description:"):
    if field not in front:
        print(f"FAIL: {path} missing '{field}' in frontmatter")
        sys.exit(1)

print(f"OK: {path}")
PYEOF
)
            echo "$result"
            echo "$result" | grep -q "^FAIL" && failed=1
          done
          exit "$failed"

      # ── Agent frontmatter ────────────────────────────────────────────────────

      - name: Check agent frontmatter
        run: |
          failed=0
          for f in agents/*.md; do
            [ -f "$f" ] || continue
            result=$(python3 - "$f" <<'PYEOF'
import sys

path = sys.argv[1]
try:
    content = open(path, encoding="utf-8").read()
except OSError as e:
    print(f"FAIL: {path} could not be read: {e}")
    sys.exit(1)

if not content.startswith("---\n"):
    print(f"FAIL: {path} missing YAML frontmatter opening ---")
    sys.exit(1)

parts = content.split("---")
if len(parts) < 3:
    print(f"FAIL: {path} frontmatter not closed with ---")
    sys.exit(1)

front = parts[1]
for field in ("name:", "description:", "model:"):
    if field not in front:
        print(f"FAIL: {path} missing '{field}' in frontmatter")
        sys.exit(1)

print(f"OK: {path}")
PYEOF
)
            echo "$result"
            echo "$result" | grep -q "^FAIL" && failed=1
          done
          exit "$failed"

      # ── Command frontmatter ──────────────────────────────────────────────────

      - name: Check command frontmatter
        run: |
          failed=0
          for f in commands/*.md; do
            [ -f "$f" ] || continue
            result=$(python3 - "$f" <<'PYEOF'
import sys

path = sys.argv[1]
try:
    content = open(path, encoding="utf-8").read()
except OSError as e:
    print(f"FAIL: {path} could not be read: {e}")
    sys.exit(1)

if not content.startswith("---\n"):
    print(f"FAIL: {path} missing YAML frontmatter opening ---")
    sys.exit(1)

parts = content.split("---")
if len(parts) < 3:
    print(f"FAIL: {path} frontmatter not closed with ---")
    sys.exit(1)

front = parts[1]
if "description:" not in front:
    print(f"FAIL: {path} missing 'description:' in frontmatter")
    sys.exit(1)

print(f"OK: {path}")
PYEOF
)
            echo "$result"
            echo "$result" | grep -q "^FAIL" && failed=1
          done
          exit "$failed"

      # ── Manifest file existence ──────────────────────────────────────────────

      - name: Verify all manifest files exist
        run: |
          python3 - <<'PYEOF'
import json, os, sys

try:
    manifest = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
except (OSError, json.JSONDecodeError) as e:
    print(f"FAIL: could not load plugin.json: {e}")
    sys.exit(1)

errors = []

for path in manifest.get("commands", []):
    # Normalise ./commands/foo.md -> commands/foo.md
    normalised = path.lstrip("./")
    if not os.path.exists(normalised):
        errors.append(f"Missing command file: {path}")

for path in manifest.get("agents", []):
    normalised = path.lstrip("./")
    if not os.path.exists(normalised):
        errors.append(f"Missing agent file: {path}")

if errors:
    for e in errors:
        print(e)
    sys.exit(1)

print(f"All manifest files present ({len(manifest.get('commands', []))} commands, "
      f"{len(manifest.get('agents', []))} agents)")
PYEOF

      - name: Verify flutter-accessibility command is registered
        run: |
          python3 - <<'PYEOF'
import json, sys
manifest = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
commands = manifest.get("commands", [])
if not any("flutter-accessibility" in c for c in commands):
    print("FAIL: commands/flutter-accessibility.md not registered in plugin.json")
    sys.exit(1)
print("OK: flutter-accessibility command is registered")
PYEOF

      # ── Node.js hook scripts ──────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node.js syntax check — hook scripts
        run: |
          failed=0
          for f in hooks/lib-node/*.cjs; do
            [ -f "$f" ] || continue
            if node --check "$f" 2>&1; then
              echo "OK: $f"
            else
              echo "FAIL: $f has syntax errors"
              failed=1
            fi
          done
          exit "$failed"

      - name: Node.js syntax check — pub-dev-mcp
        run: |
          node --check mcp-servers/pub-dev-mcp/server.js && echo "OK: server.js"
          node --check mcp-servers/pub-dev-mcp/lib/pubdev-client.js && echo "OK: pubdev-client.js"

      - name: Validate pub-dev-mcp package.json
        run: python3 -m json.tool mcp-servers/pub-dev-mcp/package.json > /dev/null && echo "OK: pub-dev-mcp/package.json"

      - name: Hook smoke test — secret_detect blocks high-confidence secrets
        run: |
          result=$(echo '{"tool_name":"Write","tool_input":{"file_path":"config.dart","content":"final apiKey = \"AIzaFakeKey1234567890abcdefghijklmnopqr\";"}}' | node hooks/lib-node/secret_detect.cjs; echo "exit:$?")
          echo "$result"
          if echo "$result" | grep -q '"decision":"block"'; then
            echo "OK: secret_detect correctly blocks Google API key"
          else
            echo "FAIL: secret_detect did not block a Google API key"
            exit 1
          fi

      - name: Hook smoke test — secret_detect allows safe content
        run: |
          result=$(echo '{"tool_name":"Write","tool_input":{"file_path":"config.dart","content":"final apiKey = \"YOUR_API_KEY_HERE\";"}}' | node hooks/lib-node/secret_detect.cjs; echo "exit:$?")
          echo "$result"
          echo "$result" | grep -q '"decision":"block"' && { echo "FAIL: secret_detect blocked a placeholder value"; exit 1; } || echo "OK: secret_detect allows placeholder"

      - name: Hook smoke test — post_edit_format exits 0 for non-dart file
        run: |
          echo '{"tool_name":"Write","tool_input":{"file_path":"README.md","content":"# test"}}' | node hooks/lib-node/post_edit_format.cjs
          echo "OK: post_edit_format exited 0 for non-dart file"

      # ── ShellCheck on scripts ─────────────────────────────────────────────────

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: ShellCheck — scripts/
        run: |
          failed=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            if shellcheck "$f"; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              failed=1
            fi
          done
          exit "$failed"
