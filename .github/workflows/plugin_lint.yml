name: Plugin Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── JSON validation ──────────────────────────────────────────────────────

      - name: Validate plugin.json
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null

      - name: Validate .mcp.json
        run: python3 -m json.tool .mcp.json > /dev/null

      - name: Validate hooks.json
        run: python3 -m json.tool hooks/hooks.json > /dev/null

      - name: Validate marketplace.json
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      # ── Shell script syntax ──────────────────────────────────────────────────

      - name: Check shell script syntax
        run: |
          failed=0
          for f in hooks/lib/*.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "FAIL: $f has syntax errors"
              failed=1
            else
              echo "OK: $f"
            fi
          done
          exit "$failed"

      # ── SKILL.md frontmatter ─────────────────────────────────────────────────

      - name: Check SKILL.md frontmatter
        run: |
          failed=0
          for f in skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            result=$(python3 scripts/check_skill_frontmatter.py "$f")
            echo "$result"
            echo "$result" | grep -q "^FAIL" && failed=1
          done
          exit "$failed"

      # ── Agent frontmatter ────────────────────────────────────────────────────

      - name: Check agent frontmatter
        run: |
          failed=0
          for f in agents/*.md; do
            [ -f "$f" ] || continue
            result=$(python3 scripts/check_agent_frontmatter.py "$f")
            echo "$result"
            echo "$result" | grep -q "^FAIL" && failed=1
          done
          exit "$failed"

      # ── Command frontmatter ──────────────────────────────────────────────────

      - name: Check command frontmatter
        run: |
          failed=0
          for f in commands/*.md; do
            [ -f "$f" ] || continue
            result=$(python3 scripts/check_command_frontmatter.py "$f")
            echo "$result"
            echo "$result" | grep -q "^FAIL" && failed=1
          done
          exit "$failed"

      # ── Manifest file existence ──────────────────────────────────────────────

      - name: Verify all manifest files exist
        run: python3 scripts/verify_manifest_files.py

      - name: Verify flutter-accessibility command is registered
        run: python3 scripts/verify_flutter_accessibility.py

      # ── Node.js hook scripts ──────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate marketplace.json matches plugin.json
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const p = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const plugin = m.plugins[0];
            if (!plugin) { console.error('FAIL: marketplace.json has no plugins[]'); process.exit(1); }
            if (plugin.name !== p.name) { console.error('FAIL: name mismatch: marketplace=' + plugin.name + ' plugin=' + p.name); process.exit(1); }
            if (plugin.version !== p.version) { console.error('FAIL: version mismatch: marketplace=' + plugin.version + ' plugin=' + p.version); process.exit(1); }
            const source = plugin.source.replace(/\\/+$/, '');
            if (!fs.existsSync(source + '/.claude-plugin/plugin.json')) { console.error('FAIL: plugins[0].source does not resolve to a directory with .claude-plugin/plugin.json'); process.exit(1); }
            console.log('OK: marketplace.json is consistent with plugin.json');
          "

      - name: Node.js syntax check — hook scripts
        run: |
          failed=0
          for f in hooks/lib-node/*.cjs; do
            [ -f "$f" ] || continue
            if node --check "$f" 2>&1; then
              echo "OK: $f"
            else
              echo "FAIL: $f has syntax errors"
              failed=1
            fi
          done
          exit "$failed"

      - name: Node.js syntax check — pub-dev-mcp
        run: |
          node --check mcp-servers/pub-dev-mcp/server.js && echo "OK: server.js"
          node --check mcp-servers/pub-dev-mcp/lib/pubdev-client.js && echo "OK: pubdev-client.js"

      - name: Validate pub-dev-mcp package.json
        run: |
          python3 -m json.tool mcp-servers/pub-dev-mcp/package.json > /dev/null
          echo "OK: pub-dev-mcp/package.json"

      - name: Hook smoke test — secret_detect blocks high-confidence secrets
        run: |
          result=$(echo '{"tool_name":"Write","tool_input":{"file_path":"config.dart","content":"final apiKey = \"AIzaFakeKey1234567890abcdefghijklmnopqr\";"}}' | node hooks/lib-node/secret_detect.cjs; echo "exit:$?")
          echo "$result"
          if echo "$result" | grep -q '"decision":"block"'; then
            echo "OK: secret_detect correctly blocks Google API key"
          else
            echo "FAIL: secret_detect did not block a Google API key"
            exit 1
          fi

      - name: Hook smoke test — secret_detect allows safe content
        run: |
          result=$(echo '{"tool_name":"Write","tool_input":{"file_path":"config.dart","content":"final apiKey = \"YOUR_API_KEY_HERE\";"}}' | node hooks/lib-node/secret_detect.cjs; echo "exit:$?")
          echo "$result"
          echo "$result" | grep -q '"decision":"block"' && { echo "FAIL: secret_detect blocked a placeholder value"; exit 1; } || echo "OK: secret_detect allows placeholder"

      - name: Hook smoke test — post_edit_format exits 0 for non-dart file
        run: |
          echo '{"tool_name":"Write","tool_input":{"file_path":"README.md","content":"# test"}}' | node hooks/lib-node/post_edit_format.cjs
          echo "OK: post_edit_format exited 0 for non-dart file"

      # ── ShellCheck on scripts ─────────────────────────────────────────────────

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: ShellCheck — scripts/
        run: |
          failed=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            if shellcheck "$f"; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              failed=1
            fi
          done
          exit "$failed"
